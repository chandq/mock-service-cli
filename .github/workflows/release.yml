# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: release

on:
  push:
    branches: [master]
    paths:
      - 'src/**' # 当 src 目录下的文件变化时触发
      - 'bin/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  # 允许手动重跑：若 npm 发布后 registry 副本同步滞后导致 manifest 同步失败，可直接重新触发（幂等，已同步则跳过）。
  workflow_dispatch:

jobs:
  unit-test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npm test --if-present
      - name: Smoke Test
        run: npm run test:src --if-present
      - name: Pack dry run
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x'
        run: npm run package:editions && npm run verify:packages

  release:
    name: Release
    needs: [unit-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use npm for Trusted Publishing
        run: npm install --global npm@11.5.1
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test --if-present
      - name: Smoke Test
        run: npm run test:src --if-present

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump version with NPM version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx standard-version -m "chore: release version %s"
          git push --follow-tags origin master
          echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.tag }}" --generate-notes

      - name: Upload coverage
        run: npm run coverage

      - name: Publish light and Ultra packages with provenance
        run: npm run publish:editions

      # Homebrew/Scoop 清单同步已从本 job 拆出（避免 registry 复制延迟把发布流程标红）：
      # release 成功后由 sync-package-managers workflow（workflow_run）自动执行，
      # 也可在 Actions 页手动重跑。请勿在本文件重复添加同步步骤，以免双跑。
